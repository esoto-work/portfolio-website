<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.N.G.E.L Visualizer</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data:;
    media-src 'self';
    connect-src 'self';
    frame-src 'self';
    form-action 'self';
    upgrade-insecure-requests;
  " />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="stylesheet" href="visualizer-styles.css" />
  <link href="https://fonts.googleapis.com/css?family=Saira" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }

    /* Three.js canvas — full-screen background behind the panel */
    #out { position: fixed; inset: 0; z-index: 0; }
    #out canvas { display: block; }

    /* A.N.G.E.L panel: title + subtitle stacked directly ABOVE the chat */
    .angel-panel {
      position: fixed;
      top: 50%;
      right: clamp(1rem, 5vw, 6rem);
      transform: translateY(-50%);
      width: min(92vw, 600px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .angel-title {
      display: inline-block;
      max-width: 0;
      white-space: nowrap;
      overflow: hidden;
      color: rgb(65, 255, 246);
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: clamp(2.6rem, 8vw, 6rem);
      letter-spacing: 0.08em;
      border-right: 2px solid #fff;
      text-shadow: 0 0 18px rgba(65, 255, 246, 0.6);
      animation: typewriter 2.5s steps(12, end) forwards, blink 0.75s step-end infinite;
    }

    .angel-subtitle {
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 1.05rem);
      letter-spacing: 0.05em;
      text-align: center;
    }

    #chat-frame {
      width: 100%;
      height: min(62vh, 460px);
      height: min(62dvh, 460px);
      border: none;
      border-radius: 1rem;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 20px rgba(19, 76, 129, 0.4);
    }

    @keyframes typewriter { to { max-width: 12ch; } }
    @keyframes blink { 50% { border-color: transparent; } }

    /* Portrait / mobile / tablet: orb centered on top, A.N.G.E.L title + chat
       anchored to the bottom (matches the centered camera in script.js). */
    @media (max-width: 1024px), (orientation: portrait) {
      .angel-panel {
        top: auto;
        bottom: 1rem;
        right: 50%;
        transform: translateX(50%);
        width: 94vw;
        gap: 0.4rem;
      }
      .angel-title { font-size: clamp(2rem, 11vw, 3.4rem); }
      .angel-subtitle { font-size: clamp(0.55rem, 2.4vw, 0.85rem); }
      #chat-frame { height: 56vh; height: 56dvh; }
    }

    /* Phones: shrink heading a touch; keep room above for the orb */
    @media (max-width: 480px) {
      .angel-title { font-size: clamp(1.8rem, 12vw, 2.8rem); }
      #chat-frame { height: 58vh; height: 58dvh; }
    }

    /* Short screens (landscape phones): drop the subtitle to save height */
    @media (max-height: 560px) {
      .angel-subtitle { display: none; }
      #chat-frame { height: 72vh; height: 72dvh; }
    }
  </style>
</head>

<body>
  <!-- Three.js canvas container (full-screen background) -->
  <div id="out"></div>

  <!-- A.N.G.E.L title + subtitle, sitting above the chat -->
  <div class="angel-panel">
    <div class="angel-title">A.N.G.E.L.</div>
    <div class="angel-subtitle">(ARTIFICIAL NEUROCOMPUTING GENERAL EXPERT LISTENER)</div>
    <iframe src="chat-module.html" id="chat-frame" title="A.N.G.E.L chat assistant"
            sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <!-- Hidden audio used by the visualizer -->
  <audio id="audio" src="PortfolioWorldWeb.mp3" autoplay playsinline style="display: none;"></audio>

  <!-- Libraries (global THREE r84 + SimplexNoise are used by script.js).
       SRI hashes pin the exact file contents — a compromised CDN can't swap in
       malicious (e.g. gambling) script without the hash failing. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/84/three.min.js" integrity="sha384-bax99F28uSeSvIcMv2Uhg5Yn7Nvf4oC2+s0VHC9Obg/js87Ilkrz/4W/cMgYETXW" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.3.0/simplex-noise.min.js" integrity="sha384-ewTeZrNyaZnu3A0z2ODoPC/QaVn/gk6aIsVt8IfAW3h4wdDgmZQAbSalMgnejM4R" crossorigin="anonymous"></script>

  <!-- App script (audio-reactive icosahedron visualizer) -->
  <script src="script.js"></script>
</body>
</html>
