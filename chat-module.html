<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- Content-Security-Policy: the assistant is fully offline (no API), so no
       external connect/script origins for AI are needed. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data:;
    connect-src 'self';
    frame-src 'self';
    form-action 'self';
    upgrade-insecure-requests;
  "/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>Profile and Sound Wave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>
  <!-- Orbitron font for futuristic look -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
   body {
  background-color: #000;
  color: #fff;
  font-family: 'Orbitron', sans-serif;
   backdrop-filter: blur(8px); /* optional: glass effect */
}

#chat {
  background-color: rgba(0, 0, 0, 0.6); /* semi-transparent black */
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 1rem;
  padding: 1rem;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px); /* optional: glass effect */
  animation: fadeIn 0.8s ease-in-out;
}

#chat-messages {
  background-color: #000;
  border: 1px solid #fff;
  border-radius: 0.5rem;
  padding: 0.5rem;
  height: 200px;
  overflow-y: auto;
  color: #fff;
  font-size: 0.9rem;
}

.message {
  margin-bottom: 0.5rem;
  word-wrap: break-word;
}

.user-message,
.bot-message {
  color: #fff;
}

input#chat-input {
  background-color: #000;
  color: #fff;
  border: 1px solid #fff;
  border-radius: 0.5rem 0 0 0.5rem;
  padding: 0.5rem;
  flex: 1;
}

input#chat-input:focus {
  outline: none;
  border-color: #fff;
}

button {
  background-color: #000;
  color: #fff;
  border: 1px solid #fff;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}

button:hover {
  background-color: #fff;
  color: #000;
  border-color: #fff;
}

.reactive-circle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, white, transparent);
  animation: react 1s infinite;
}

@keyframes react {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.5);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.message { margin-bottom: 0.5rem; line-height: 1.4; word-break: break-word; }
.user-message { color: #8be9fd; }
.bot-message { color: #fff; }

#quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.5rem;
}
.qr-btn {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 9999px;
  padding: 0.3rem 0.7rem;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s ease;
}
.qr-btn:hover {
  background: #fff;
  color: #000;
  border-color: #fff;
}

.fade-in {
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

  </style>
</head>
<body class="bg-black flex flex-col items-center justify-between min-h-screen relative ">

    <button id="more-options" class="bg-black text-white p-2 rounded-full flex items-center justify-center">
      <i class="fas fa-ellipsis-h"></i>
     </button>
    <button id="analyze-document" class="bg-black text-white p-2 rounded-full flex items-center justify-center">
      <i class="fas fa-file-medical-alt"></i>

    <button id="home-button" class="bg-black text-white p-2 rounded-full flex items-center justify-center">

    </button>
    <button id="clear-chat" class="bg-black text-white p-2 rounded-full flex items-center justify-center">
      <i class="fas fa-trash"></i>
    </button> -->
  </div>

  <div class="flex flex-col items-center space-y-4 mt-20 mb-4 relative">
    <div id="reactive-circle" class="reactive-circle w-48 h-48 hidden"></div>
    <div class="flex space-x-4">
    <!--  <img alt="Profile picture of two people smiling" class="w-32 h-32 rounded-full relative z-10" height="200" src="https://ca-times.brightspotcdn.com/dims4/default/e178207/2147483647/strip/true/crop/1600x1066+0+0/resize/2000x1333!/format/webp/quality/75/?url=https%3A%2F%2Fcalifornia-times-brightspot.s3.amazonaws.com%2Fca%2Fb5%2F9b66af844acc81746c3651efd2aa%2Fgrok-elon-musk-ai-circle.gif" width="200"/>-->
      <div id="additional-profiles" class="flex space-x-4"></div>
    </div>
  </div>

  <div id="chat" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white p-4 rounded-lg w-11/12 max-w-md h-[88%] max-h-[540px] flex flex-col">
    <div id="chat-messages" class="flex-1 overflow-y-auto mb-2">
      <!-- Chat messages will appear here -->
    </div>
    <div id="quick-replies"><!-- quick-reply buttons injected here --></div>
    <div class="flex">
      <input id="chat-input" type="text" class="flex-1 p-2 rounded-l-lg bg-black text-white" placeholder="Type a message..."/>
      <button id="send-button" class="bg-gray-800 text-white px-4 py-2">Send</button>
      <button id="tts-button" class="bg-gray-800 text-white px-4 py-2"><i class="fas fa-volume-up"></i></button>
      <button id="stt-button" class="bg-gray-800 text-white px-3 py-2 rounded-r-lg"><i class="fas fa-microphone"></i></button>
    </div>
  </div>

  <!--
    A.N.G.E.L is a fully offline, rule-based assistant. No API keys, no network
    calls, nothing to leak. It matches keywords against a local knowledge base
    and answers questions about Eddie (contact, skills, projects, hiring).
  -->
  <script>
    (function () {
      const chatContainer = document.getElementById("chat-messages");
      const inputField    = document.getElementById("chat-input");
      const sendButton    = document.getElementById("send-button");
      const ttsButton     = document.getElementById("tts-button");
      const sttButton     = document.getElementById("stt-button");
      const reactiveCircle = document.getElementById("reactive-circle");
      const quickReplies  = document.getElementById("quick-replies");

      const EMAIL    = "esoto.work@outlook.com";
      const LINKEDIN = "https://www.linkedin.com/in/eddie-scyber/";

      let lastUtterance = null;
      let recognition = null;
      let isListening = false;

      // ---- Knowledge base: keyword sets -> canned answers (no API, all local) ----
      const intents = [
        { keys: ["hello","hi ","hey","yo","greet","good morning","good evening"],
          reply: "Greetings — I'm A.N.G.E.L, Eddie Soto's portfolio assistant. I can tell you how to reach Eddie, what he does, his skills, and his projects. Tap a button below or just ask me a question." },
        { keys: ["contact","reach","get in touch","talk to","connect","speak"],
          reply: "You can reach Eddie two ways: email him at " + EMAIL + " (fastest — he usually replies within a day or two), or connect on LinkedIn at " + LINKEDIN + ". For job or project inquiries, email is best." },
        { keys: ["email","e-mail","mail","write to","message him"],
          reply: "Eddie's email is " + EMAIL + ". Send a short note about what you need — a role, a collaboration, or a question — and he'll get back to you." },
        { keys: ["linkedin","social","profile","network"],
          reply: "Connect with Eddie on LinkedIn: " + LINKEDIN + ". It's the best place to view his professional background and send him a message." },
        { keys: ["who","about","yourself","tell me about eddie","bio","background story"],
          reply: "Eddie Soto is a System Administrator and Developer with a background in Information Systems and hands-on experience in cybersecurity, web development, and infrastructure management. He pairs technical depth with creative problem-solving and is passionate about building secure, efficient, future-ready systems." },
        { keys: ["skill","stack","tech","technology","language","tool","what can he do","expertise"],
          reply: "Eddie's toolkit includes SQL, Python, HTML, CSS, JavaScript, and Solidity, and he's comfortable working in Linux environments. His focus areas are cybersecurity, secure system design, and web development." },
        { keys: ["project","portfolio","built","made","work he","what has he"],
          reply: "This portfolio is itself one of Eddie's projects — an interactive 3D site built with Three.js and vanilla JavaScript, including me, the A.N.G.E.L assistant. He also explores crypto/Solidity smart contracts and security tooling. Scroll up to the Projects section to see it in action." },
        { keys: ["experience","career","history","worked","employment"],
          reply: "Eddie has hands-on experience across system administration, cybersecurity, web development, and infrastructure management, all grounded in an Information Systems foundation." },
        { keys: ["hire","hiring","available","availability","freelance","opportunity","open to","recruit","job offer","work with"],
          reply: "Eddie is open to new opportunities. The best first step is to email him at " + EMAIL + " with a few details about the role or project, and he'll follow up to discuss fit and next steps." },
        { keys: ["education","degree","school","study","studied","master","masters","goal","future"],
          reply: "Eddie plans to pursue a master's degree in cybersecurity to sharpen his skills and take on advanced roles defending systems and infrastructure. His current foundation is in Information Systems." },
        { keys: ["resume","cv","curriculum"],
          reply: "For Eddie's latest resume/CV, email him at " + EMAIL + " and he'll send it over." },
        { keys: ["crypto","blockchain","solidity","bitcoin","web3","smart contract"],
          reply: "Crypto is what first pulled Eddie into encryption and secure systems — it sparked his passion for cybersecurity and digital-asset protection. He works with Solidity for smart contracts." },
        { keys: ["security","cyber","cybersecurity","secure","hacking","defense"],
          reply: "Cybersecurity is Eddie's core passion. He focuses on securing systems and infrastructure and is working toward a master's in the field. Want his contact info to talk security work? Just ask for 'contact'." },
        { keys: ["location","where","based","city","timezone"],
          reply: "For location and availability details, email Eddie directly at " + EMAIL + "." },
        { keys: ["thank","thx","appreciate"],
          reply: "You're welcome! Anything else I can help with? You can always reach Eddie at " + EMAIL + "." },
        { keys: ["bye","goodbye","see you","later","done"],
          reply: "Take care! Reach Eddie any time at " + EMAIL + " or on LinkedIn." },
        { keys: ["help","what can you","options","menu","commands"],
          reply: "I can answer questions about: Contact, Email, LinkedIn, About Eddie, Skills, Projects, Experience, Hiring, Education, and Resume. Tap a button below or type your question." },
      ];

      const FALLBACK = "I'm a simple offline assistant, so I may have missed that. Try asking about: contact, email, LinkedIn, about Eddie, skills, projects, or hiring — or tap one of the buttons below.";
      const GREETING = "Greetings. I'm A.N.G.E.L, Eddie Soto's portfolio assistant. Ask how to contact Eddie, about his skills, or his projects — or tap a quick option below.";

      const quickButtons = [
        { label: "Contact",   q: "contact" },
        { label: "Email",     q: "email" },
        { label: "LinkedIn",  q: "linkedin" },
        { label: "About",     q: "about eddie" },
        { label: "Skills",    q: "skills" },
        { label: "Projects",  q: "projects" },
        { label: "Hire Eddie",q: "hire" },
      ];

      function findReply(text) {
        const t = " " + text.toLowerCase() + " ";
        let best = null, bestScore = 0;
        for (const intent of intents) {
          let score = 0;
          for (const k of intent.keys) { if (t.includes(k)) score += k.length; }
          if (score > bestScore) { bestScore = score; best = intent; }
        }
        return best ? best.reply : FALLBACK;
      }

      function addMessage(text, who) {
        const div = document.createElement("div");
        div.classList.add("message", who === "user" ? "user-message" : "bot-message");
        div.textContent = (who === "user" ? "You: " : "A.N.G.E.L: ") + text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) return;
          speechSynthesis.cancel();
          lastUtterance = new SpeechSynthesisUtterance(text);
          lastUtterance.volume = 1.0;
          lastUtterance.onstart = () => {
            if (reactiveCircle) reactiveCircle.classList.remove("hidden");
            window.parent.postMessage({ type: "activateVisualizer" }, window.location.origin);
          };
          lastUtterance.onend = () => {
            if (reactiveCircle) reactiveCircle.classList.add("hidden");
            window.parent.postMessage({ type: "stop-visualizer" }, window.location.origin);
          };
          speechSynthesis.speak(lastUtterance);
        } catch (e) { /* TTS unsupported — ignore */ }
      }

      function handleUserText(raw) {
        const msg = (raw || "").trim();
        if (!msg) return;
        addMessage(msg, "user");
        inputField.value = "";
        const reply = findReply(msg);
        // tiny delay so it feels conversational
        setTimeout(() => { addMessage(reply, "bot"); speak(reply); }, 250);
      }

      // Build quick-reply buttons
      quickButtons.forEach(b => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "qr-btn";
        btn.textContent = b.label;
        btn.addEventListener("click", () => handleUserText(b.q));
        quickReplies.appendChild(btn);
      });

      // Input wiring
      sendButton.addEventListener("click", () => handleUserText(inputField.value));
      inputField.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleUserText(inputField.value);
      });

      // Replay last reply via TTS
      ttsButton.addEventListener("click", () => {
        if (!("speechSynthesis" in window)) return;
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        else if (lastUtterance) speechSynthesis.speak(lastUtterance);
      });

      // Voice input (offline browser SpeechRecognition; optional)
      sttButton.addEventListener("click", () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { addMessage("Voice input isn't supported in this browser.", "bot"); return; }
        if (!recognition) {
          recognition = new SR();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = "en-US";
          recognition.onresult = (event) => {
            const transcript = Array.from(event.results).map(r => r[0].transcript).join("");
            handleUserText(transcript);
          };
          recognition.onend = () => { isListening = false; sttButton.classList.remove("mic-on"); };
          recognition.onerror = () => { isListening = false; sttButton.classList.remove("mic-on"); };
        }
        if (isListening) { recognition.stop(); isListening = false; sttButton.classList.remove("mic-on"); }
        else { try { recognition.start(); isListening = true; sttButton.classList.add("mic-on"); } catch (e) {} }
      });

      // Opening greeting
      addMessage(GREETING, "bot");
    })();
  </script>
</body>
</html>
